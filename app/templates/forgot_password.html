{% extends "base.html" %}
{% block title %}Forgot password | LAKSHYA{% endblock %}
{% block content %}
<div class="glass auth">
    <h1>Forgot password?</h1>
    <p class="s">Enter your email and we'll send you a code to reset it.</p>

    <form method="post" autocomplete="off">
        <input type="email" name="email" placeholder="you@example.com" required autocomplete="email" autofocus>
        <button class="btn p" type="submit">Send reset code</button>
    </form>

    <p class="alt" style="margin-top:16px">
        Remembered it? <a href="{{ url_for('auth.login') }}">Back to login</a>
    </p>
</div>
{% endblock %}
