{% extends "base.html" %}
{% block title %}Log in | LAKSHYA{% endblock %}
{% block content %}
<div class="glass auth">
    <h1>Log in</h1>
    <p class="s">Pick up your quest where you left off.</p>
    <form method="post">
        <input type="text" name="username" placeholder="Username" required autocomplete="username">
        <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
        <button class="btn p" type="submit">Log in</button>
    </form>
    <p class="alt" style="margin-top:10px">
        <a href="{{ url_for('auth.forgot_password') }}">Forgot your password?</a>
    </p>
    <p class="alt">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div>
{% endblock %}
