{% extends "base.html" %}
{% block title %}Set new password | LAKSHYA{% endblock %}
{% block content %}
<div class="glass auth">
    <h1>Set a new password</h1>
    <p class="s">Choose a strong password. Minimum 6 characters.</p>

    <form method="post" autocomplete="off">
        <input type="password" name="password" placeholder="New password" required autocomplete="new-password"
            minlength="6" autofocus>
        <input type="password" name="confirm" placeholder="Confirm new password" required autocomplete="new-password"
            minlength="6">
        <button class="btn p" type="submit">Update password</button>
    </form>

    <p class="alt" style="margin-top:16px">
        <a href="{{ url_for('auth.login') }}">Back to login</a>
    </p>
</div>
{% endblock %}
